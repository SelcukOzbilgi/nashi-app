name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated language tables
        run: python3 scripts/generate-localizations.py --check
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Scan full public history for secrets
        run: python3 scripts/scan-secrets.py
  mac-source:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Build native macOS app
        run: swift build --product Nashi
      - name: Isolated native UI, accessibility and artwork checks
        run: python3 scripts/test-native-ui.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: mac-native-ui
          path: build/native-ui
          retention-days: 7
          if-no-files-found: warn
      # Fork: the whole suite runs, not a filtered subset. Conversion tests need the
      # same external tools the app installs (LibreOffice, an FFmpeg with WebP and
      # Vorbis encoders, Deno) plus the pinned ExifTool checkout.
      - name: Install conversion tools for the full test suite
        run: |
          brew install ffmpeg-full deno
          brew install --cask libreoffice
          zsh scripts/setup-exiftool.sh
          prefix="$(brew --prefix ffmpeg-full)/bin"
          echo "NASHI_FFMPEG=$prefix/ffmpeg" >> "$GITHUB_ENV"
          echo "NASHI_FFPROBE=$prefix/ffprobe" >> "$GITHUB_ENV"
      - name: Full Swift test suite
        run: swift test
